# Datos para conectarse a MySQL. Estos valores son los que trae XAMPP por defecto (usuario root sin contraseña).
# Si en tu computador son distintos, NO cambies este archivo: crea 'config_bd.local.ini' con la misma sección
# y solo los valores que cambian. Ese archivo no se sube a GitHub (está en .gitignore).
[mysql]
host = localhost
puerto = 3306
usuario = root
clave =
base_datos = lacasetita
